<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Grand Continental Hotel Assistant</title>
    <style>
      body {
        background-color: #000;
        color: #FFA500;
        font-family: Arial, sans-serif;
        margin: 0;
        padding: 20px;
      }

      h2 {
        color: #FFA500;
      }

      p {
        color: #ccc;
      }

      /* تخصيص حاوية الـ iframe */
      .chat-container {
        width: 100%;
        height: 80vh;
        border: 2px solid #FFA500;
        border-radius: 10px;
        overflow: hidden;
        margin-top: 20px;
      }

      iframe {
        width: 100%;
        height: 100%;
        border: none;
      }
    </style>
  </head>

  <body>
    <h2>👋 Welcome to Grand Continental Hotel</h2>
    <p>
      I'm your virtual assistant. Ask me anything about room bookings, facilities,
      or nearby attractions. Available 24/7!
    </p>

    <div class="chat-container">
      <iframe
        src="https://chatling.ai/embed/1845453434"
        allow="microphone; autoplay"
        title="Chat Assistant"
      ></iframe>
    </div>
  </body>
</html>
